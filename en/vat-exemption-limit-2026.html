<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VAT exemption limit monitor 2026 | Liber Pro</title><link rel="stylesheet" href="../style.css?v=20260719-9"><body><main class="container" style="padding:55px 20px"><p><a href="narzedzia.html">← All tools</a></p><h1>VAT exemption limit monitor 2026</h1><p>Monitor taxable sales included in the Polish VAT exemption limit.</p><p>Business start date <input id="start" type="date" value="2026-01-01"> Sales as of <input id="date" type="date" value="2026-08-15"> Included net sales <input id="sales" type="number" value="0"></p><label><input id="seat" type="checkbox"> Business established in Poland</label><br><label><input id="eligible" type="checkbox"> No activities excluding the exemption</label><br><button id="go">Check limit</button><p id="err" style="color:#b45309"></p><div id="out" aria-live="polite"></div><p><small>This tool monitors the sales threshold only; it does not determine eligibility or VAT-R registration duties.</small></p></main><script>(()=>{const p=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'PLN'}).format(n);function run(){let x=new Date(start.value+'T00:00:00'),d=new Date(date.value+'T00:00:00'),e=new Date('2026-12-31T00:00:00'),s=Number(sales.value),day=864e5;if(!start.value||!date.value||!Number.isFinite(s)||s<0||x.getFullYear()!=2026||d<x||d>e){err.textContent='Enter valid 2026 dates and sales.';return}err.textContent=seat.checked&&eligible.checked?'':'The result shows the threshold only; eligibility has not been confirmed.';let total=Math.round((e-x)/day)+1,elapsed=Math.round((d-x)/day)+1,limit=240000*total/365,avg=s/elapsed,forecast=avg*total,cross=avg?new Date(x.getTime()+(Math.ceil(limit/avg)-1)*day):null;out.innerHTML='<h2>Sales limit: '+p(limit)+'</h2><p>Sales entered: '+p(s)+'</p><p>Remaining: '+p(Math.max(0,limit-s))+'</p><p>Annual forecast: '+p(forecast)+'</p><p>Estimated crossing date: '+(cross&&cross<=e?cross.toLocaleDateString('en-GB'):'not at the current pace')+'</p>'}go.onclick=run;run()})()</script></body></html>
