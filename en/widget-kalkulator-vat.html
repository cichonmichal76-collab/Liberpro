<!DOCTYPE html>
<html lang="en"><head><style>
.kv{font-family:'Archivo',sans-serif;max-width:600px;margin:0 auto;background:#fff;border-radius:16px;border:1px solid #e2e8f0;overflow:hidden;box-shadow:0 4px 32px rgba(10,37,64,.1)}
.kv-top{background:#0a2540;padding:24px 32px 20px;position:relative;overflow:hidden}
.kv-top::before{content:'';position:absolute;right:-30px;top:-30px;width:180px;height:180px;border-radius:50%;background:rgba(46,158,114,.12);pointer-events:none}
.kv-top h2{font-family:'Playfair Display',serif;font-size:22px;color:#fff;margin-bottom:2px}
.kv-top h2 em{color:#2e9e72;font-style:italic}
.kv-top p{font-size:12px;color:rgba(255,255,255,.45)}
.kv-main{padding:24px 32px 0}
.kv-row{display:grid;grid-template-columns:180px 1fr;gap:20px;align-items:center;margin-bottom:20px}
.kv-inp-wrap{position:relative}
.kv-inp-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#94a3b8;margin-bottom:6px;display:block}
.kv-inp{width:100%;border:2px solid #e2e8f0;border-radius:10px;padding:14px 44px 14px 14px;font-size:22px;font-weight:600;font-family:'Archivo',sans-serif;color:#0f172a;outline:none;background:#fff;transition:border-color .15s;-moz-appearance:textfield}
.kv-inp::-webkit-inner-spin-button,.kv-inp::-webkit-outer-spin-button{-webkit-appearance:none}
.kv-inp:focus{border-color:#1a6b4a}
.kv-inp-unit{position:absolute;right:12px;bottom:16px;font-size:14px;font-weight:600;color:#cbd5e1}
.kv-slider-wrap{padding-top:22px}
.kv-slider-top{display:flex;justify-content:space-between;margin-bottom:6px}
.kv-slider-top span{font-size:11px;color:#94a3b8}
.kv-slider{width:100%;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;outline:none;cursor:pointer;background:linear-gradient(to right,#1a6b4a 0%,#1a6b4a var(--pct,0%),#e2e8f0 var(--pct,0%),#e2e8f0 100%)}
.kv-slider::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#0a2540;border:3px solid #fff;box-shadow:0 2px 8px rgba(10,37,64,.3);cursor:pointer;transition:transform .1s}
.kv-slider::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#0a2540;border:3px solid #fff;box-shadow:0 2px 8px rgba(10,37,64,.3);cursor:pointer}
.kv-slider::-webkit-slider-thumb:hover{transform:scale(1.15)}
.kv-slider-val{text-align:center;font-size:12px;font-weight:600;color:#1a6b4a;margin-top:5px}
.kv-type{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:18px}
.kv-type button{padding:10px 8px;border:1.5px solid #e2e8f0;border-radius:10px;background:#f8fafc;font-family:'Archivo',sans-serif;font-size:13px;font-weight:500;color:#475569;cursor:pointer;transition:all .15s;line-height:1.3}
.kv-type button span{display:block;font-size:10px;color:#94a3b8;font-weight:400;margin-top:2px}
.kv-type button.on{background:#0a2540;border-color:#0a2540;color:#fff}
.kv-type button.on span{color:rgba(255,255,255,.5)}
.kv-type button:hover:not(.on){background:#e8f5f0;border-color:#1a6b4a;color:#1a6b4a}
.kv-rate-row{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.kv-rate-lbl{font-size:12px;font-weight:600;color:#0f172a;flex-shrink:0}
.kv-rates{display:flex;gap:6px;flex:1}
.kv-rates button{flex:1;padding:8px 4px;border:1.5px solid #e2e8f0;border-radius:8px;background:#f8fafc;font-family:'Archivo',sans-serif;font-size:13px;font-weight:500;color:#475569;cursor:pointer;transition:all .15s}
.kv-rates button.on{background:#1a6b4a;border-color:#1a6b4a;color:#fff;font-weight:600}
.kv-rates button:hover:not(.on){background:#e8f5f0;border-color:#1a6b4a;color:#1a6b4a}
.kv-sep{height:1px;background:#f1f5f9;margin:0 32px}
.kv-results{padding:22px 32px}
.kv-res-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#94a3b8;margin-bottom:14px}
.kv-res-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.kv-card{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:16px;text-align:center;transition:all .2s}
.kv-card.hi{background:#0a2540;border-color:#0a2540;transform:translateY(-2px);box-shadow:0 8px 24px rgba(10,37,64,.2)}
.kv-card-lbl{font-size:11px;font-weight:600;color:#94a3b8;margin-bottom:6px;display:block}
.kv-card.hi .kv-card-lbl{color:rgba(255,255,255,.45)}
.kv-card-val{font-size:19px;font-weight:600;color:#0f172a;font-variant-numeric:tabular-nums}
.kv-card.hi .kv-card-val{color:#2e9e72;font-size:21px}
.kv-card-sub{font-size:11px;color:#94a3b8;margin-top:3px}
.kv-card.hi .kv-card-sub{color:rgba(255,255,255,.3)}
.kv-foot{padding:14px 32px;background:#f8fafc;border-top:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between}
.kv-foot-txt{font-size:11px;color:#94a3b8}
.kv-foot-txt strong{color:#1a6b4a}
.kv-foot a{font-size:12px;font-weight:600;color:#fff;background:#1a6b4a;padding:7px 16px;border-radius:6px;text-decoration:none;transition:background .15s}
.kv-foot a:hover{background:#2e9e72}
@media(max-width:480px){.kv-row{grid-template-columns:1fr;gap:12px}.kv-slider-wrap{padding-top:0}}
</style>

<link rel="alternate" href="https://www.liberpro.pl/widget-kalkulator-vat.html" hreflang="pl"><link rel="alternate" href="https://www.liberpro.pl/en/widget-kalkulator-vat.html" hreflang="en"><link rel="alternate" href="https://www.liberpro.pl/widget-kalkulator-vat.html" hreflang="x-default"></head><body><div class="kv">
  <div class="kv-top">
    <h2>Calculator <em>VAT</em> 2026</h2>
    <p>Enter the amount or move the slider - the result will appear immediately</p>
  </div>
  <div class="kv-main">
    <div class="kv-row">
      <div class="kv-inp-wrap">
        <span class="kv-inp-lbl">Amount</span>
        <input type="number" class="kv-inp" id="kv-inp" placeholder="1000" min="100" max="100000" step="1" oninput="kvOnInp(this.value)">
        <span class="kv-inp-unit">PLN</span>
      </div>
      <div class="kv-slider-wrap">
        <div class="kv-slider-top"><span>PLN 100</span><span>PLN 100,000</span></div>
        <input type="range" class="kv-slider" id="kv-sl" min="100" max="100000" step="100" value="1000" oninput="kvOnSl(this.value)">
        <div class="kv-slider-val" id="kv-sv">PLN 1,000</div>
      </div>
    </div>
    <div class="kv-type">
      <button class="on" onclick="kvType('netto',this)">NET amount<span>excluding VAT</span></button>
      <button onclick="kvType('brutto',this)">GROSS amount<span>including VAT</span></button>
      <button onclick="kvType('vat',this)">VAT amount<span>the tax itself</span></button>
    </div>
    <div class="kv-rate-row">
      <span class="kv-rate-lbl">VAT rate:</span>
      <div class="kv-rates" id="kv-rates">
        <button class="on" data-r="0.23" onclick="kvRate(this)">23%</button>
        <button data-r="0.08" onclick="kvRate(this)">8%</button>
        <button data-r="0.05" onclick="kvRate(this)">5%</button>
        <button data-r="0.00" onclick="kvRate(this)">0%</button>
      </div>
    </div>
  </div>
  <div class="kv-sep"></div>
  <div class="kv-results">
    <div class="kv-res-lbl">Result</div>
    <div class="kv-res-grid">
      <div class="kv-card" id="kv-cn"><span class="kv-card-lbl">Net</span><div class="kv-card-val" id="kv-rn">—</div><div class="kv-card-sub">excluding VAT</div></div>
      <div class="kv-card" id="kv-cv"><span class="kv-card-lbl">VAT</span><div class="kv-card-val" id="kv-rv">—</div><div class="kv-card-sub" id="kv-rvs">23%</div></div>
      <div class="kv-card" id="kv-cb"><span class="kv-card-lbl">Gross</span><div class="kv-card-val" id="kv-rb">—</div><div class="kv-card-sub">including VAT</div></div>
    </div>
  </div>
  <div class="kv-foot">
    <span class="kv-foot-txt">Calculator <strong>Liber Pro Accounting</strong></span>
    <a href="https://www.liberpro.pl/kontakt.html" target="_blank">Free consultation</a>
  </div>
</div>

<script>function sortBlogByNewest() {
  var grid = document.getElementById('blogGrid');
  var cards = Array.from(grid.querySelectorAll('.blog-card'));
  cards.sort(function(a, b) {
    var da = a.getAttribute('data-sort-date') || '';
    var db = b.getAttribute('data-sort-date') || '';
    return db.localeCompare(da);
  });
  cards.forEach(function(card) {
    card.style.display = '';
    grid.appendChild(card);
  });
}

function filterBlogByKey(key, event) {
  document.querySelectorAll('.blog-filter').forEach(function(button) {
    button.classList.remove('active');
  });
  if (event && event.currentTarget) {
    event.currentTarget.classList.add('active');
  }
  var cards = Array.from(document.querySelectorAll('#blogGrid .blog-card'));
  if (key === 'newest') {
    sortBlogByNewest();
    return;
  }
  cards.forEach(function(card) {
    var cardKey = card.getAttribute('data-filter-key') || '';
    card.style.display = key === 'all' || cardKey === key ? '' : 'none';
  });
}

document.addEventListener('DOMContentLoaded', function() {
  document.querySelectorAll('.blog-filter').forEach(function(button) {
    button.addEventListener('click', function(event) {
      filterBlogByKey(button.getAttribute('data-filter-key') || 'all', event);
    });
  });
  sortBlogByNewest();
});</script>
<!-- ═══ END OF VAT CALCULATOR ═══ --></body></html>
